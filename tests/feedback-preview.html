<!doctype html>
<meta charset="utf-8">
<title>Downright — feedback preview</title>
<style>
  body { font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         margin: 0; padding: 110px 32px 64px; background: #F4EFE6; color: #17140F; }
  @media (prefers-color-scheme: dark) { body { background: #17140F; color: #F4EFE6; } }
  h1 { font-size: 20px; margin: 0 0 6px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em;
       opacity: .6; margin: 28px 0 8px; }
  p { max-width: 62ch; }
  button { font: inherit; padding: 7px 13px; margin: 4px 6px 4px 0; border-radius: 8px;
           border: 1px solid currentColor; background: none; color: inherit; cursor: pointer; }
  pre { max-width: 62ch; background: rgba(128,128,128,.14); padding: 12px;
        border-radius: 8px; overflow: auto; font-size: 13px; }
  /* A page doing its worst to smother the toast. The host wins on
     specificity for everything it declares; `all:initial` on :host keeps the
     rest of the page's ideas out of the shadow root. */
  #downright-toast-host { border: 6px dashed red !important; }
</style>

<h1>Downright feedback preview</h1>
<p>Manual check for what the reader sees: the shared <code>common/toast.js</code>
   component in every state, top-right, and the reason each clip outcome reports.</p>

<h2>Toast states</h2>
<p>
  <button data-ok="1" data-title="Copied as Markdown" data-detail="≈1.4k tokens · 5,612 chars">Success</button>
  <button data-ok="1" data-title="Copied selection as Markdown" data-detail="≈180 tokens · 712 chars">Success (selection)</button>
  <button data-ok="1" data-title="Saved as Markdown" data-detail="tf–idf.md">Success (saved)</button>
</p>
<p id="reasons"></p>

<h2>Clip outcomes</h2>
<p>Runs the real <code>clip()</code> pipeline and prints the reason code it reports.</p>
<p>
  <button id="run-normal">This page</button>
  <button id="run-empty">Empty document</button>
  <button id="run-pdf">PDF-shaped document</button>
  <button id="run-deny">Clipboard denied</button>
  <button id="run-nosave">Download blocked</button>
</p>
<pre id="out">—</pre>

<script src="../src/common/defaults.js"></script>
<script src="../src/common/blocked.js"></script>
<script src="../src/common/toast.js"></script>
<script src="../src/content/convert.js"></script>
<script src="../src/content/extract.js"></script>
<script src="../src/content/clip.js"></script>
<script>
  const dr = globalThis.__downright;
  const B = globalThis.DOWNRIGHT_BLOCKED;
  const out = document.getElementById('out');

  for (const b of document.querySelectorAll('[data-title]')) {
    b.onclick = () => dr.showToast({
      ok: b.dataset.ok === '1', title: b.dataset.title, detail: b.dataset.detail,
    });
  }

  // One button per reason in the catalogue, so none goes unread.
  const holder = document.getElementById('reasons');
  for (const code of Object.keys(B.REASONS)) {
    const b = document.createElement('button');
    b.textContent = code;
    b.onclick = () => dr.showToast(Object.assign({ ok: false }, B.describe(code)));
    holder.appendChild(b);
  }

  const report = (label, res) => {
    out.textContent = label + '\n' + JSON.stringify({
      ok: res.ok, copied: res.copied, downloaded: res.downloaded,
      reason: res.reason, toasted: res.toasted,
      chars: res.meta && res.meta.chars,
    }, null, 1);
  };

  const blankDoc = (withEmbed) => {
    const d = document.implementation.createHTMLDocument('Blank');
    if (withEmbed) {
      const e = d.createElement('embed');
      e.setAttribute('type', 'application/pdf');
      d.body.appendChild(e);
    }
    return d;
  };

  const run = async (label, opts, patch) => {
    const undo = patch ? patch() : null;
    try {
      report(label, await dr.clip(Object.assign({ toast: true }, opts)));
    } finally {
      if (undo) undo();
    }
  };

  document.getElementById('run-normal').onclick = () =>
    run('this page', { mode: 'auto', copy: true });
  document.getElementById('run-empty').onclick = () =>
    run('empty document', { mode: 'full', copy: true, document: blankDoc(false) });
  document.getElementById('run-pdf').onclick = () =>
    run('pdf-shaped document', { mode: 'full', copy: true, document: blankDoc(true) });
  document.getElementById('run-deny').onclick = () =>
    run('clipboard denied', { mode: 'auto', copy: true }, () => {
      const write = navigator.clipboard.writeText;
      const exec = document.execCommand;
      navigator.clipboard.writeText = () => Promise.reject(new Error('denied'));
      document.execCommand = () => false;
      return () => { navigator.clipboard.writeText = write; document.execCommand = exec; };
    });
  document.getElementById('run-nosave').onclick = () =>
    run('download blocked', { mode: 'auto', download: true }, () => {
      const create = URL.createObjectURL;
      URL.createObjectURL = () => { throw new Error('blocked'); };
      return () => { URL.createObjectURL = create; };
    });
</script>
