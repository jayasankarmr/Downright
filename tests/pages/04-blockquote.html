<head>

  <title>Blockquotes</title>
  <base href="https://example.org/docs/page.html">

<body>
  <blockquote>
    <p>Single line quote.</p>
  </blockquote>
  <blockquote>
    <p>Outer quote.</p>

    </blockquote>

  </blockquote>
