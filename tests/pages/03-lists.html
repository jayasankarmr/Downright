<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lists</title>
  <base href="https://example.org/docs/page.html">
</head>
<body>
  <ul>
    <li>First item</li>
    <li>Second with <strong>bold</strong>
      <ul>
        <li>Nested one</li>
        <li>Nested two
          <ol>
            <li>Deep a</li>
            <li>Deep b</li>
          </ol>
        </li>
      </ul>
    </li>
    <li>Third</li>
  </ul>
  <ol start="5">
    <li>Fifth</li>
    <li>Sixth</li>
  </ol>
  <ul>
    <li><input type="checkbox" checked> Done task</li>
    <li><input type="checkbox"> Open task</li>
  </ul>
  <ol>
    <li>
      <p>Loose paragraph one.</p>
      <p>And a second paragraph.</p>
    </li>
    <li>
      <p>Item with code:</p>
      <pre><code class="language-python">print("hi")</code></pre>
    </li>
  </ol>
</body>
</html>
