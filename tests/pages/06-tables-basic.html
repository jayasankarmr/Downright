<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Basic tables</title>
  <base href="https://example.org/docs/page.html">
</head>
<body>
  <table>
    <caption>Monthly costs</caption>
    <thead>
      <tr><th>Item</th><th align="center">Qty</th><th style="text-align: right">Price</th></tr>
    </thead>
    <tbody>
      <tr><td>Widget A</td><td align="center">2</td><td style="text-align: right">$5.00</td></tr>
      <tr><td>Pipe | char</td><td align="center">1</td><td style="text-align: right">$3.50</td></tr>
      <tr><td>Multi<br>line</td><td align="center">7</td><td style="text-align: right">$1.25</td></tr>
      <tr><td><strong>Total</strong></td><td></td><td style="text-align: right"><em>$14.75</em></td></tr>
    </tbody>
  </table>
</body>
</html>
