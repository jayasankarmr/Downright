<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Selection contexts</title>
  <base href="https://example.org/docs/page.html">
</head>
<body>
  <p>Intro paragraph that is not selected.</p>
  <ol start="3" id="letters">
    <li id="li-a">Alpha</li>
    <li id="li-b">Beta</li>
    <li id="li-c">Gamma</li>
    <li id="li-d">Delta</li>
  </ol>
  <table id="t">
    <thead><tr><th>Col A</th><th>Col B</th></tr></thead>
    <tbody>
      <tr id="r1"><td>a1</td><td>b1</td></tr>
      <tr id="r2"><td>a2</td><td>b2</td></tr>
    </tbody>
  </table>
</body>
</html>
