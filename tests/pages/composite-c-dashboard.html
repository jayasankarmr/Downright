<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dashboard</title>
  <base href="https://app.example.org/dashboard">
</head>
<body>
  <dash-board>
    <template shadowrootmode="open">
      <style>:host{display:block}</style>
      <h1>Metrics Dashboard</h1>
      <section>
        <h2>Weekly numbers</h2>
        <slot></slot>
      </section>
    </template>
    <table>
      <tr><td>Monday</td><td>120</td></tr>
      <tr><td>Tuesday</td><td>145</td></tr>
    </table>
    <status-pill><template shadowrootmode="open"><span>Status: <slot></slot></span></template>All systems go</status-pill>
  </dash-board>
  <form>
    <input type="text" placeholder="Search">
    <button type="submit">Go</button>
  </form>
  <svg width="120" height="30"><rect width="100" height="10"></rect></svg>
  <canvas width="200" height="100"></canvas>
  <p>Footer note.</p>
</body>
</html>
