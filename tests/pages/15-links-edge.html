<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Link edge cases</title>
  <base href="https://example.org/docs/page.html">
</head>
<body>
  <p><a href="/path/with spaces/doc.html">Spaced URL</a></p>
  <p><a href="https://en.wikipedia.org/wiki/Rocket_(disambiguation)">Parens URL</a></p>
  <p><a href="javascript:void(0)">JS link</a></p>
  <p><a href="mailto:hi@example.com">hi@example.com</a></p>
  <p><a></a>Empty anchor stays out.</p>
  <p>Edge spaces:<b> bold with spaces </b>done.</p>
</body>
</html>
