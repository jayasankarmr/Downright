<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tables with spans</title>
  <base href="https://example.org/docs/page.html">
</head>
<body>
  <table>
    <tr><th>Name</th><th colspan="2">Contact</th></tr>
    <tr><td>Ada</td><td>ada@example.com</td><td rowspan="2">Shared cell</td></tr>
    <tr><td>Grace</td><td>grace@example.com</td></tr>
  </table>
  <table>
    <tr><td>r1c1</td><td>r1c2</td></tr>
    <tr><td>r2c1</td><td>r2c2</td></tr>
  </table>
</body>
</html>
