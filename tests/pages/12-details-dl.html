<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Details and definition lists</title>
  <base href="https://example.org/docs/page.html">
</head>
<body>
  <details open>
    <summary>Open summary</summary>
    <p>Visible details content.</p>
  </details>
  <details>
    <summary>Closed summary</summary>
    <p>Hidden but still clipped.</p>
  </details>
  <dl>
    <dt>Term one</dt>
    <dd>Definition one.</dd>
    <dt>Term two</dt>
    <dd><p>Definition two, paragraph.</p></dd>
  </dl>
</body>
</html>
