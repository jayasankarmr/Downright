name: CI

on:
  push:
  pull_request:
  schedule:
    # Weekly regression run — catches breakage even when nothing is pushed.
    - cron: "17 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check every script
        run: |
          find src firefox tests scripts -name '*.js' -print0 | xargs -0 -n1 node --check
          echo "syntax ok"

      - name: No-network audit
        run: bash scripts/check-no-network.sh

      - name: Unit tests (pure helpers)
        run: node --test tests/unit.test.mjs

      - name: Conversion suite (headless Chrome)
        run: bash scripts/run-tests.sh

      - name: Build store zips
        run: bash scripts/build.sh

      - name: Upload zips
        uses: actions/upload-artifact@v4
        with:
          name: downright-builds
          path: dist/*.zip
          if-no-files-found: error
